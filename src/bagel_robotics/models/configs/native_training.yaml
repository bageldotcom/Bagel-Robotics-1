model:
  _target_: bagel_robotics.models.runtime.create_vpp2_wan21_14b
  model_id: ${paths.wan}
  dit_checkpoint_path: ${paths.video_init}
  action_dit_pretrained_path: ${paths.action_init}
  skip_dit_load_from_pretrain: false
  tokenizer_model_id: ${paths.wan}/google/umt5-xxl
  tokenizer_max_len: 128
  load_text_encoder: false
  load_clip_encoder: true
  mot_checkpoint_mixed_attn: true
  action_chunk_size: 1
  action_visible_video_frames: 5
  video_lora:
    enabled: false
  proprio_dim: 16
  video_dit_config:
    model_type: i2v
    patch_size:
    - 1
    - 2
    - 2
    text_len: 128
    in_dim: 36
    dim: 5120
    hidden_dim: 5120
    ffn_dim: 13824
    freq_dim: 256
    text_dim: 4096
    out_dim: 16
    num_heads: 40
    attn_head_dim: 128
    num_layers: 40
    eps: 1.0e-06
    qk_norm: true
    cross_attn_norm: true
    use_gradient_checkpointing: true
    video_attention_mask_mode: bidirectional
  action_dit_config:
    action_dim: 16
    hidden_dim: 1024
    ffn_dim: 4096
    num_layers: 40
    num_heads: 40
    attn_head_dim: 128
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    use_gradient_checkpointing: true
  video_scheduler:
    train_sampling_strategy: pure_noise
    train_shift: 5.0
    infer_shift: 3.0
    num_train_timesteps: 1000
    beta_alpha: 7.0
    beta_beta: 1.0
  action_scheduler:
    train_shift: 3.0
    infer_shift: 3.0
    num_train_timesteps: 1000
  loss:
    lambda_video: 1.0
    lambda_action: 1.0
paths:
  data: ""
  media: ""
  wan: ""
  video_init: ""
  action_init: null
