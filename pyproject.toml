[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bagel-robotics"
version = "0.2.0"
description = "Bagel Labs’ world-action model for bimanual robot manipulation"
authors = [{name = "The Bagel-Robotics-1 Authors"}]
readme = "README.pypi.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "licenses/*"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://www.bagel.com/"
Repository = "https://github.com/bageldotcom/Bagel-Robotics-1"
Documentation = "https://github.com/bageldotcom/Bagel-Robotics-1#quick-start"
"Model weights" = "https://huggingface.co/bageldotcom/Bagel-Robotics-1"
"Model release" = "https://blog.bagel.com/p/bagel-robotics-1"

[project.scripts]
bagel-robotics = "bagel_robotics.cli:main"

[project.optional-dependencies]
data = ["av==16.0.1", "pyarrow==24.0.0", "pandas==2.2.3"]
inference = [
  "torch==2.11.0", "torchvision==0.26.0", "numpy==1.26.4",
  "transformers==4.49.0", "huggingface-hub==0.36.0", "hydra-core==1.3.8",
  "omegaconf==2.3.0", "einops==0.8.1", "Pillow==12.0.0", "rich==14.2.0",
  "safetensors==0.5.3", "ftfy==6.3.1", "regex>=2024.11", "sentencepiece>=0.2",
  "opencv-python-headless==4.11.0.86", "websockets==16.1.1", "h5py==3.16.0",
  "PyYAML==6.0.3", "msgpack==1.2.3"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["bagel_robotics*"]

[tool.setuptools.package-data]
bagel_robotics = ["resources/**/*", "resources/*", "inference/configs/*.json", "models/configs/*.yaml"]
